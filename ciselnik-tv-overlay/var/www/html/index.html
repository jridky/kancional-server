<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<script src="jquery-3.4.1.min.js"></script>
<style>
html, body{
   background: black;
   width: 100%;
   height: 100%;
   overflow: hidden;
   color: white;
   cursor: none;
   font-family: Arial;
   padding: 0px;
   margin: 0px;
}

#number, #psalm, #verse, #songbook{
   text-align: center;
   background: rgba(0,0,0,0.8);
}

#number, #verse, #songbook{
   margin: 0px;
   padding: 0px;
   position: fixed;
   top: 0px;
   right: 0px;
}

.radius{
   border-bottom-left-radius: 15px;
   border-bottom-right-radius: 15px;
}

#number{
   height: 14%;
   width: 20%;
   line-height: 1.5em;
}

#number{
  font-size: 5vw;
  letter-spacing: 10px;
  text-indent: 10px;
  font-weight: bold;
}

#verse{
   top: 14%;
   width: 20%;
   line-height: 1.5em;
   height: 5%;
   padding-bottom: 3%;
   font-size: 4vw;
}

#songbook{
   top: 22%;
   width: 20%;
   line-height: 1.5em;
   height: 4%;
   padding-bottom: 2%;
   font-size: 3vw;
   overflow: hidden;
}

#psalm {
    position: fixed;
    bottom: 0px;
    padding: 0px;
    margin: 0px;
    background: rgba(0,0,0,0.8);
    width: 100%;
    overflow: hidden;
    font-size: 10em;
    height: 20%;
}

p {
  margin: 0px;
  padding: 0px;
}

.centered{
  position: relative;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#psalm.solo{
   height: 100%;
   margin: 0px;
   padding: 0px;
   text-align: center;
   align-items: center;
   justify-content: center;
   overflow: hidden;
}
</style>
</head>
<body>
<video id="video" width="100%" height="100%" autoplay></video>
<div id="number">
<div class="centered"></div>
</div>
<div id="verse" class="radius">
<div class="centered"></div>
</div>
<div id="songbook" class="radius">
<div class="centered"></div>
</div>
<div id="psalm">
<div class="centered">
</div>
</div>
</body>

<script>
var timeout, socket = false;
$(function(){
    $("#number").css("color","white");
    $("#psalm, #verse, #number, #songbook").hide();
    var video = document.querySelector("#video");

    checkSocket();
    setInterval(checkSocket, 1800);
    if (navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 19200 }, height: { ideal: 10800 } } })
            .then(function (stream) {
                video.srcObject = stream;
            })
            .catch(function (error) {
                console.log("Something went wrong!");
            });
    }
});

function checkSocket(){
    if(socket != false){
        if(socket.readyState != WebSocket.CLOSED){
            return;
        }
    }
    socket = new WebSocket('ws://kancional.local:2020');
    socket.addEventListener('message', getMessage);
}

function getMessage (event){
    try{
        var answer = JSON.parse(event.data);
        if(timeout != false){
            clearTimeout(timeout);
        }
        timeout = setTimeout(offScreen, 8800000);
        displayValue(answer);
    }catch(error){
        offScreen();
    }
}

function offScreen(){
    clearTimeout(timeout);
    timeout = false;
    $("#psalm, #verse, #number, #songbook").hide();
    $("#video").show();
    $("#psalm").removeClass("solo");
}

function fitText(el, startSize) {
    el.css("font-size", startSize);
    var inner = el.children().first();
    while (inner.outerHeight() > el.innerHeight() || inner.outerWidth() > el.innerWidth()) {
        var value = parseInt(el.css("font-size")) - 10;
        if (value <= 0) break;
        el.css("font-size", value + "px");
    }
}

function displayValue(answer){
    if(answer.tv === false){
        $("#video").hide();
        $("#psalm").addClass("solo");
    } else {
        $("#video").show();
        $("#psalm").removeClass("solo");
    }

    if(answer.psalm == "" && (answer.verseText == undefined || answer.verseText == "")){
        if(answer.song == ""){
            $("#number, #verse, #songbook").hide();
        } else {
            $("#number .centered").html(answer.song);
            if(answer.verse != "" && answer.verse != "0"){
                if(isFinite(answer.verse)){
                    $("#verse .centered").html(answer.verse+". sloka");
                } else {
                    $("#verse .centered").html(answer.verse);
                }
                $("#verse").show();
                $("#number").removeClass("radius");
                if(answer.songbook){
                    $("#songbook .centered").html(answer.songbook);
                    var verseBottom = $("#verse").position().top + $("#verse").outerHeight(true);
                    $("#songbook").css("top", verseBottom + "px");
                    $("#songbook").show();
                    fitText($("#songbook"), "3vw");
                    $("#verse").removeClass("radius");
                } else {
                    $("#songbook").hide();
                    $("#verse").addClass("radius");
                }
            }else{
                $("#verse .centered").html("");
                $("#verse").hide();
                if(answer.songbook){
                    $("#songbook .centered").html(answer.songbook);
                    $("#songbook").css("top", "14%");
                    $("#songbook").show();
                    fitText($("#songbook"), "3vw");
                    $("#number").removeClass("radius");
                } else {
                    $("#songbook").hide();
                    $("#number").addClass("radius");
                }
            }
            $("#number").show();
        }
        $("#psalm").hide();
    }else{
        $("#psalm .centered").html(answer.psalm != "" ? answer.psalm : answer.verseText);
        $("#number, #verse, #songbook").hide();
        $("#psalm").show();
        fitText($("#psalm"), "30em");
    }

    if(jQuery.isEmptyObject(answer)){
        offScreen();
    }
}
</script>
</html>
